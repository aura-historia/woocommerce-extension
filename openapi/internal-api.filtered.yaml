  parameters:
    AsyncProductListingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: One value only; native duplicates and comma-joined values are
        invalid (`400 BAD_HEADER_VALUE`) before publication. Use 1–128 visible
        ASCII bytes excluding comma. Supply the same key with the unchanged
        ordered batch for transport retries. If absent, a key is generated and
        returned on evaluated reports; it cannot be recovered if that response
        is lost.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x2B\x2D-\x7E]{1,128}$
      example: catalog-sync-2026-09-29
  headers:
    AsyncProductListingIdempotencyKey:
      description: Effective key, echoed on every evaluated report (including
        non-2xx); not guaranteed on pre-evaluation ApiError responses.
        CORS-exposed for browser clients.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x2B\x2D-\x7E]{1,128}$
      example: catalog-sync-2026-09-29
    OAuthNoCache:
      description: Legacy cache prevention for OAuth credential traffic.
      schema:
        type: string
        enum:
          - no-cache
  responses:
    ShippingManagementError400:
      description: Invalid path/body/schema/revision (INVALID_OBJECT_ID or BAD_BODY_VALUE).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShippingManagementError401:
      description: Missing or invalid authentication (INVALID_CREDENTIALS).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShippingManagementError403:
      description: Missing current authority or credential scope (FORBIDDEN).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShippingManagementError404:
      description: Source, scoped profile, compatible location or attributed Party
        absent (LISTING_SOURCE_NOT_FOUND, SHIPPING_PROFILE_NOT_FOUND,
        SHIPPING_LOCATION_NOT_FOUND, PARTY_NOT_FOUND).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShippingManagementError409:
      description: Stale/exhausted revision, conflicting creation retry or ineligible
        profile/reference (SHIPPING_STALE_REVISION, SHIPPING_REVISION_EXHAUSTED,
        SHIPPING_CREATION_KEY_CONFLICT, SHIPPING_PROFILE_RETIRED,
        SHIPPING_REFERENCE_INELIGIBLE).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShippingManagementError500:
      description: Persisted state cannot be decoded or storage operation failed
        (SHIPPING_STORAGE_ERROR).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShippingManagementError503:
      description: Storage or transaction unavailable (SHIPPING_TEMPORARILY_UNAVAILABLE).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Cognito access JWT bearer token. Signature, issuer, client, token use
        and expiry

        are validated locally. Signed integer `auth_time` and `iat` claims are
        required;

        sessions authenticated at or before the persisted local revocation
        cutoff are rejected.

        This check shares the existing identity lookup and makes no live Cognito
        status request.

        Revocation requested only in Cognito is not observed immediately;
        already-issued JWTs

        can remain accepted until expiry. Use the administrator
        session-revocation endpoint

        for immediate local enforcement. Database authentication failures return

        `503 AUTH_TEMPORARILY_UNAVAILABLE`.

        This scheme is used for authenticated user routes and for partner routes
        that accept Cognito user tokens.
    AccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Aura Historia bearer access token created through
        `/v1/me/access-tokens`.

        Tokens are sent as standard bearer authorization headers.

        Selected partner routes accept this scheme instead of the removed
        partner API-key flow.
tags:
  - name: ProductListings
    description: Product retrieval, product history, similar-product discovery,
      product search, and partner catalog ingestion workflows.
  - name: ListingSources
    description: ListingSource retrieval, authenticated creation and update, and
      caller-administered listing sources.
  - name: OAuth
    description: OAuth 2.0 authorization, token, revocation, introspection, and
      OAuth client metadata management.
