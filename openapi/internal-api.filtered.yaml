      description: |
        Supported currencies (ISO 4217 codes):
        - EUR: Euro
        - GBP: British Pound
        - USD: US Dollar
        - AUD: Australian Dollar
        - CAD: Canadian Dollar
        - NZD: New Zealand Dollar
        - CNY: Chinese Yuan
        - BRL: Brazilian Real
        - PLN: Polish Złoty
        - TRY: Turkish Lira
        - JPY: Japanese Yen
        - CZK: Czech Koruna
        - RUB: Russian Ruble
        - AED: UAE Dirham
        - SAR: Saudi Riyal
        - HKD: Hong Kong Dollar
        - SGD: Singapore Dollar
