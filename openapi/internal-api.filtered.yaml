components:
  schemas:
    PutWoocommerceListingSourceIngestionConfigurationData:
      type: object
      additionalProperties: false
      required:
        - webhookSecret
      properties:
        webhookSecret:
          type: string
          writeOnly: true
          description: Required nonblank provider secret. Preserved exactly for HMAC
            verification and never returned.
        currency:
          allOf:
            - $ref: "#/components/schemas/CurrencyData"
          nullable: true
        language:
          allOf:
            - $ref: "#/components/schemas/LanguageData"
          nullable: true
    ApiError:
      type: object
      description: Standard error response format (RFC 9457)
      required:
        - status
        - title
        - error
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        title:
          type: string
          description: HTTP status code in human-readable form
          example: Bad Request
        error:
          type: string
          description: Error code identifier
          example: BAD_PARAMETER
        source:
          $ref: "#/components/schemas/ApiErrorSource"
        detail:
          type: string
          description: Human-readable error message
          example: "Expected any of: 'true' or 'false'. Got: 'invalid'"
    CreateProductListingData:
      type: object
      additionalProperties: false
      description: >
        Data for creating a single product via the partner batch-create endpoint.
      required:
        - sourceListingId
        - url
        - images
      properties:
        sourceListingId:
          type: string
          description: The listing source's own identifier for the product. Must be unique
            within the listing source.
          example: baroque-violin-001
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: "Optional localized title. Omit or send `null` when no title is
            available. The title is normalized; styled letters and digits become
            ordinary text and emoji and ornamental symbols are removed. A title
            without remaining text, such as a blank or emoji-only title, is
            rejected with `BAD_BODY_VALUE`: synchronous batches fail with `400`,
            asynchronous batches report that item as a failure."
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized description. Omit or send `null` when no
            description is available.
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
          description: Optional asking-price assertion for the product.
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional lower bound of the estimated price range
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional upper bound of the estimated price range
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
          description: Omit or send `null` when Aura has no reliable current availability
            assertion.
        url:
          type: string
          format: uri
          description: URL to the product on the listing source's website
          example: https://my-listing-source.com/product-listings/baroque-violin
        images:
          type: array
          items:
            type: string
            format: uri
          description: List of image URLs for the product. May be empty.
          example:
            - https://my-listing-source.com/images/violin-1.jpg
            - https://my-listing-source.com/images/violin-2.jpg
        auction:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionData"
          description: Omit for no Auction or lot changes, or send an asserted nested
            Auction/lot-facts patch. `null` is invalid. `auctionId` must
            identify an existing Auction for this ListingSource.
    AsyncProductListingBatchReport:
      type: object
      additionalProperties: false
      description: Admission report, not a listing creation or update result. For
        every evaluated batch, acceptedCount plus the number of failures equals
        the original array length.
      required:
        - submissionId
        - acceptedCount
        - failures
      properties:
        submissionId:
          type: string
          description: Opaque correlation identifier only; not a status resource or batch
            deduplication token.
          example: plis1_example
        acceptedCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of publisher-confirmed admitted entries; never includes
            unconfirmed sends.
        failures:
          type: array
          maxItems: 100
          description: Exactly one per non-confirmed original entry, sorted by original
            zero-based index. Empty for fully admitted or empty batches.
          items:
            $ref: "#/components/schemas/AsyncProductListingBatchFailure"
    OAuthTokenResponseData:
      type: object
      description: >
        Token response returned by `POST /v1/oauth/token` and

        `GET /v1/oauth/tokens/by-third-party-code/{thirdPartyCode}`.

        The `access_token` is an Aura Historia bearer access token. `expires_in`
        is omitted

        for non-expiring tokens. `third_party_exchange_code` is only present on
        the

        direct token exchange response.
      required:
        - access_token
        - token_type
        - scope
      properties:
        access_token:
          type: string
          description: The issued Aura Historia access token (plaintext bearer value).
          example: aurahistoria_abcdefghijk_verylongtokenvalue
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 0
          description: Seconds until expiry; omitted when the token does not expire.
          example: 3600
        scope:
          type: string
          description: Space-separated list of scopes granted to the access token.
          example: product-listings:write
        third_party_exchange_code:
          type: string
          format: uuid
          description: >
            Optional one-time exchange code returned by `POST /v1/oauth/token`.

            It can be redeemed once via `GET
            /v1/oauth/tokens/by-third-party-code/{thirdPartyCode}`

            within 60 seconds to obtain the same access token.
          example: 01970f22-2bf0-7000-8000-000000000099
    ShippingProfileSummaryData:
      type: object
      additionalProperties: false
      required:
        - shippingProfileId
        - listingSourceId
        - name
        - managementRevision
        - termsRevision
        - lifecycle
      properties:
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
        listingSourceId:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
        name:
          type: string
        managementRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        termsRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        lifecycle:
          type: string
          enum:
            - ACTIVE
            - RETIRED
    ShippingProfileData:
      type: object
      additionalProperties: false
      required:
        - shippingProfileId
        - listingSourceId
        - managementRevision
        - termsRevision
        - lifecycle
        - content
      properties:
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
        listingSourceId:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
        managementRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        termsRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        lifecycle:
          type: string
          enum:
            - ACTIVE
            - RETIRED
        content:
          $ref: "#/components/schemas/ShippingProfileContentData"
      description: Protected management detail; retains retired references and site
        assertions, excludes evidence. Never expose this DTO as public
        collection addresses.
    CreateShippingProfileData:
      type: object
      additionalProperties: false
      required:
        - creationKey
        - content
        - evidence
      properties:
        import:
          $ref: "#/components/schemas/ShippingImportWriteData"
        creationKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
        content:
          $ref: "#/components/schemas/ShippingProfileContentData"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ShippingEvidenceInputData"
          maxItems: 32
          minItems: 0
    ReplaceShippingProfileData:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - content
        - evidence
      properties:
        import:
