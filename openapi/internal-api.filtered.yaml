    ListingAvailabilityData:
      type: string
      enum:
        - AVAILABLE
        - IN_STOCK
        - LIMITED_AVAILABILITY
        - BACK_ORDER
        - MADE_TO_ORDER
        - PRE_ORDER
        - PRE_SALE
        - UNAVAILABLE
        - RESERVED
        - OUT_OF_STOCK
        - SOLD_OUT
      description: Current reliable source assertion of listing purchase availability.
        Omitted or `null` means Aura has no reliable current assertion.
      example: IN_STOCK
    ProductListingAuctionData:
      type: object
      additionalProperties: false
      description: Partner ProductListing nested write patch. `auctionId` must
        identify an existing Auction for the same ListingSource. Omit it to
        preserve membership, send null to clear membership, or send a value to
        set it. Omit a lot/timing leaf to preserve it, send null to clear a
        clearable leaf, or send a value to set it.
      properties:
        auctionId:
          type: string
          nullable: true
          description: Existing same-ListingSource Aura Auction TypeID. Omit to preserve
            membership; send null to clear it.
          example: auc_01jgfjjz4ne2g0000000000000
        lotNumber:
          type: string
          maxLength: 128
          nullable: true
          description: Omit to preserve the lot label; send null to clear it; send a value
            to set it.
          example: 42A
        cataloguePosition:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: Omit to preserve the catalogue position; send null to clear it;
            send a value to set it.
          example: 7
        timing:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionTimesData"
          nullable: true
    AsyncProductListingBatchFailure:
      type: object
      additionalProperties: false
      required:
        - index
        - error
        - retryable
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99
          description: Original zero-based batch position, authoritative even when
            sourceListingId cannot be echoed.
        sourceListingId:
          type: string
          description: Included only if present, valid, and safe to echo; omitted otherwise.
        error:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Bounded safe code, never raw exception or payload text. Includes
            BAD_BODY_VALUE, PRODUCT_LISTING_INGESTION_PAYLOAD_TOO_LARGE,
            ENQUEUE_FAILED (definitely unsuccessful send), ENQUEUE_UNCONFIRMED
            (possibly queued), ENQUEUE_NOT_ATTEMPTED (budget before send),
            ENQUEUE_BLOCKED (eligible FIFO successor held),
            PRODUCT_LISTING_INGESTION_INTERNAL_ERROR, and applicable narrower
            item-validation codes.
          example: ENQUEUE_UNCONFIRMED
        retryable:
          type: boolean
          description: Whether unchanged-whole-batch retry is appropriate; never
            permission to resubmit a compacted subset with the same key.
            Unconfirmed is retryable; validation and size errors are not.
            Blocked inherits its predecessor's retryability; deterministic
            configuration errors need repair.
    ShippingProfileContentData:
      type: object
      additionalProperties: false
      required:
        - name
        - attributedPartyId
        - terms
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributedPartyId:
          type: string
          pattern: ^pty_[0-7][0-9a-hjkmnp-tv-z]{25}$
          nullable: true
        terms:
          $ref: "#/components/schemas/AdvertisedDeliveryTermsData"
    ShippingImportWriteData:
      type: object
      additionalProperties: false
      required:
        - integration
        - sequence
        - acquiredAt
        - requestKey
      properties:
        acquiredAt:
          type: string
          format: date-time
          description: Successful acquisition time for every command, including
            removal/correction; must follow the latest source/integration
            authority change.
        integration:
          $ref: "#/components/schemas/ListingDeliveryIntegrationData"
        sequence:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        requestKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
        objectKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
          nullable: true
        observation:
          anyOf:
            - $ref: "#/components/schemas/ShippingImportObservationData"
            - type: object
              nullable: true
              enum:
                - null
      description: "Optional import semantics on existing commands. objectKey is
        required only on profile creation; it identifies a stable
        source/producer/integration object independently of requestKey. sequence
        increases per touched component within the current source lifecycle; it
        is producer acquisition order, never receive time. Omitted observation
        does not renew observation time. Creation, changed normalized profile
        terms, changed default assignment and changed listing assertions and
        first claims of equal implicit selections require observation; explicit
        owned-component removals do not renew observation time. Acquisition
        ordering uses microsecond precision. Equal terms with observation
        explicitly refresh acquisition evidence without semantic revision
        changes. Exact requestKey replay returns current committed state without
        effects for 90 days; changed reuse conflicts permanently. Current
        source/grant/integration authority is rechecked even on replay. Imports
        cannot modify manually owned components. 409 codes:
        SHIPPING_IMPORT_AUTHORITY_STALE, SHIPPING_IMPORT_OWNERSHIP_CONFLICT,
        SHIPPING_IMPORT_REQUEST_CONFLICT, SHIPPING_IMPORT_OUT_OF_ORDER,
        SHIPPING_IMPORT_IDENTITY_EXISTS. Refetch and reconcile conflicts; never
        rebase an old payload onto the newest revision. Missing catalog listing
        is retryable 404 SHIPPING_IMPORT_DEPENDENCY_MISSING; retain the record
        until catalog creation commits. No shipping write creates or restores
        catalog products."
    ShippingEvidenceInputData:
      type: object
