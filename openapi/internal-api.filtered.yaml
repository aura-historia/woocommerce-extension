      description: Revision-checked delivery command. Requires product-listings:write
        credential scope and current administrator or active operator
        Partnership source authority. Responses and errors are no-store.
        Commands never create or restore listings. Current references are
        validated at execution. SET/UNCHANGED/CLEAR and coherent whole-policy
        replacement preserve unrelated facts.
      requestBody:
