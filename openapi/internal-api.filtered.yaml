# Filtered OpenAPI spec for Aura Historia Partner Connect.
# Generated by scripts/generate-openapi-client.mjs.
# Source: https://raw.githubusercontent.com/aura-historia/backend/792444f6d62cfb9f8dd4dc44ffb47a420de54cad/docs/swagger.yaml
openapi: 3.0.0
info:
  title: Aura Historia API Reference
  description: >
    ## Overview


    The Aura Historia API powers the Aura Historia antiques platform and its
    partner-facing integrations.

    It exposes product discovery, listing source discovery, personalization,
    partner onboarding, and integration

    workflows on top of Aura Historia's serverless AWS platform.


    This reference is designed for two audiences:

    - **Internal developers** building Aura Historia product-listings,
    operational tooling, and backoffice workflows

    - **External partners and integrators** synchronizing inventory, consuming
    platform data, or
      integrating with delegated access

    ## Core API domains


    - **ProductListings and listing-sources** — search, retrieve, and explore
    product-listings, related product-listings, product
      history, and listing source data
    - **Personalization** — manage watchlists, saved search filters, and user
    notifications

    - **Partner workflows** — submit partnership applications, maintain
    partnerships, ingest catalog data
      in batches, and receive WooCommerce webhooks
    - **Identity and access** — manage user accounts, Aura Historia access
    tokens, and OAuth 2.0
      clients and token flows
    - **Billing** — create Stripe checkout, billing-portal, and
    subscription-management sessions


    ## Authentication model


    The API uses more than one authentication scheme depending on the route:


    - **`BearerAuth`** — Cognito **access** JWT bearer tokens for authenticated
    user, admin, and
      partner-user workflows. Cognito ID tokens are not accepted as API credentials.
    - **`AccessTokenAuth`** — Aura Historia opaque bearer access tokens created
    via
      `/api/v1/me/access-tokens` or OAuth 2.0, primarily intended for partner automations and server-to-server
      ingestion scenarios.

    When a route lists multiple security schemes, any one of the listed schemes
    may be accepted.

    Some read endpoints can also be called without authentication, while a valid
    user token may enrich

    the response with personalized state such as watchlist, notification, or
    search-filter metadata.


    ## Data and response conventions


    - **PATCH:** an omitted request member remains unchanged. A documented
    nullable PATCH member
      accepts `null` to clear its value; `null` for any other member returns `400 BAD_BODY_VALUE`.
      Use `[]`, not `null`, to replace a non-null collection with an empty collection. Empty HTTP
      bodies are invalid, `{}` is a valid object-PATCH no-op, and the partner-product PATCH `[]`
      remains a valid empty batch. Responses may omit absent optional values.
    - Product detail, watchlist, and saved-search match reads accept optional
    **`language`** and
      **`currency`** parameters. Currency defaults to `EUR`. Detail pricing contains the seller's source
      amounts, converted display amounts, and FX valuation metadata. Active product-listings use the latest persisted
      snapshot; sold product-listings use their immutable sale snapshot. Product history remains immutable, source-only,
      and is not localized.
    - Request-wide errors are returned as **`application/problem+json`** using a
    consistent RFC 9457-style structure
      with `status`, `title`, `error`, optional `source`, and optional `detail`
    - Many list and search endpoints use **cursor-based pagination** via
    `searchAfter`

    - Origin API responses include server-generated `X-Request-Id` and
    `X-Correlation-Id` headers. Clients may send `X-Correlation-Id` to preserve
    a trace only when it is a 1–128-character ASCII value containing letters,
    digits, `.`, `_`, or `-`; invalid values are replaced. Both headers are
    CORS-exposed; CloudFront removes them from viewer responses on the six
    cache-enabled discovery behaviors so shared cache hits cannot replay origin
    IDs.

    - Requests are limited to 1 MiB and time out after 30 seconds.

    - `GET /api/v1/health` is a process liveness check. `GET /api/v1/ready`
    returns `204` only when the configured PostgreSQL and OpenSearch
    dependencies are reachable; it otherwise returns `503`.

    - WooCommerce webhook ingestion responds with **`204 No Content`** after
    signed validation. A mapped raw-capture command receives `204` only after
    confirmed shared FIFO admission; authorized ignored create/update status
    events are no-op `204`. Queue admission is not raw capture, provider receipt
    persistence, canonical normalization, or search visibility. Capture
    conflicts are handled by the consumer, not returned synchronously; existing
    partner Product batch writes remain synchronous.


    ## Environment endpoints


    - **Development:** `https://api.stage.aura-historia.com`

    - **Production:** `https://api.aura-historia.com`


    ## Notes for integrators


    - Treat Aura Historia identifiers such as `listingSourceId`,
    `productListingId`, `eventId`, `userSearchFilterId`,
      and `partnershipApplicationId` as opaque values
    - For partner product ingestion, `sourceListingId` is the partner-controlled
    identifier and should
      remain stable within a listing source
    - Endpoints marked `deprecated` or `x-disabled` are retained for reference
    only and should not be
      used for new integrations
