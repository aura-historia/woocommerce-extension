paths:
  /api/v1/listing-sources/{listingSourceId}/ingestion-configurations/woocommerce:
    put:
      summary: Replace WooCommerce ListingSource ingestion configuration
      description: >
        Creates or completely replaces the WooCommerce ingestion configuration
        for a ListingSource.

        The caller must be a Cognito-authenticated user or Aura access token
        owner with Partnership

        write access to the source. Delegated Aura access tokens require
        `listing-sources:write`.

        This PUT atomically enables WOOCOMMERCE when needed. The webhook secret
        is required,

        nonblank, write-only, and never returned. Omitted or null currency and
        language clear those

        optional values. Repeating the same request is safe.
      operationId: putWoocommerceListingSourceIngestionConfiguration
      tags:
        - ListingSources
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Strict `ls_` ListingSource TypeID.
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutWoocommerceListingSourceIngestionConfigurationDa\
                ta"
            example:
              webhookSecret: generated-provider-secret
              currency: EUR
              language: de
      responses:
        "201":
          description: WooCommerce was newly enabled and configured. No response body is
            returned.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                example: no-store
        "204":
          description: Existing WooCommerce configuration was replaced or already matched.
            No response body is returned.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                example: no-store
        "400":
          description: Invalid ListingSource ID (`INVALID_OBJECT_ID`), or malformed JSON,
            unknown request property, or invalid request value
            (`BAD_BODY_VALUE`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer credential (`INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Delegated scope missing or Partnership write access denied
            (`FORBIDDEN`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Authorized ListingSource no longer exists
            (`LISTING_SOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Optimistic concurrency conflict (`CONFLICT`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal failure (`LISTING_SOURCE_INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Temporary authorization or persistence failure
            (`LISTING_SOURCE_TEMPORARILY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/listing-sources/{listingSourceId}/product-listings/async:
    post:
      summary: Submit a batch of product-listing creates asynchronously (Partner API)
      operationId: postAsyncPartnerProductListings
      tags:
        - ProductListings
      description: >
        Submits the same JSON array of create objects as the synchronous POST,
        with up to 100

        original entries. Accepts a partner user's Cognito access JWT or Aura
        access token;

        delegated access requires `product-listings:write`. No client-supplied
        queue or authority

        metadata is accepted. Each entry is parsed and validated independently
        after whole-request

        JSON/array/size validation; invalid entries do not prevent eligible
        siblings from being

        Existing create field rules apply (including optional `title` and
        `description`, omitted/null availability,

        optional pricing, and invalid outer `auction: null`). A syntactically
        valid missing Auction,

        existing listing key, partnership/source authority, lifecycle, and other
        business

        conflicts are decided downstream, not reported as immediate item
        failures.


        Only confirmed queue admission counts as accepted. `202` means
        admission, not creation,

        completion, rollback, or immediate search visibility. An unconfirmed
        send may already

        have been queued. `submissionId` is an opaque correlation identifier,
        not a job ID:

        there is no submission status endpoint, batch-level deduplication, or
        Location header.

        No created listing IDs or synchronous mutation results are returned.


        For a non-empty evaluated batch, at least one confirmed acceptance
        yields `202`, even

        with item failures. With zero accepted, any unconfirmed send or
        retryable send/deadline/FIFO

        blocked outcome yields `503`; otherwise internal/configuration failures
        yield `500`;

        otherwise all encoded-message-size failures yield `413`; remaining
        validation/value/size

        failures yield `400`. An empty array returns `202` after authentication
        and capability

        checks, with no sends. Every evaluated report uses the same JSON schema
        and echoes the

        effective `Idempotency-Key`, including non-2xx reports. Before item
        evaluation, bad

        path/key, malformed JSON, non-array, empty text, or over-100 array
        returns `400`;

        authentication `401`, insufficient capability `403`,
        whole-body/front-door limit `413`,

        and pre-evaluation internal/configuration or transient dependency
        failure `500` or `503`.

        These request-wide failures use `ApiError` and send nothing.


        Supply one `Idempotency-Key` for retries; a key is generated if omitted
        and echoed

        on evaluated responses. A lost response containing a generated key
        cannot be recovered.

        After transport uncertainty retry the exact unchanged ordered logical
        batch with the

        same key, including previously rejected entries at their original
        zero-based indices;

        never compact, reorder, or change its content under that key.
        Per-command downstream

        receipts deduplicate independently; the submission ID does not suppress
        the batch.

        Correct definitely invalid items in a separate request with a new key
        and do not include

        accepted/uncertain siblings. A same-group eligible successor is blocked
        when its FIFO

        predecessor is unresolved; unrelated groups may still be accepted. FIFO
        covers

        shared-queue acceptance per group, not cross-group or execution order.
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Strict `ls_` ListingSource TypeID.
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
        - $ref: "#/components/parameters/AsyncProductListingIdempotencyKey"
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Same array and item contract as synchronous create; individual
          invalid items produce report failures, not whole-batch rejection.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/CreateProductListingData"
            example:
              - sourceListingId: SKU-001
                title:
                  text: Baroque Violin
                  language: en
                description:
                  text: An eighteenth-century violin.
                  language: en
                url: https://my-listing-source.com/product-listings/SKU-001
                images:
                  - https://my-listing-source.com/images/violin-1.jpg
      responses:
        "202":
          description: At least one item confirmed admitted, or an authorized empty array.
            May include item-level failures.
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
              examples:
                partial_admission:
                  summary: Four original entries; indices 0 and 2 confirmed accepted
                  value:
                    submissionId: plis1_example
                    acceptedCount: 2
                    failures:
                      - index: 1
                        sourceListingId: SKU-002
                        error: BAD_BODY_VALUE
                        retryable: false
                      - index: 3
                        sourceListingId: SKU-004
                        error: ENQUEUE_UNCONFIRMED
                        retryable: true
                empty_batch:
                  summary: Empty authorized batch; no sends
                  value:
                    submissionId: plis1_example
                    acceptedCount: 0
                    failures: []
        "400":
          description: Pre-evaluation invalid request (ApiError), or zero accepted with
            only item validation/value/size rejections (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 400
                title: Bad Request
                error: BAD_BODY_VALUE
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
              example:
                submissionId: plis1_example
                acceptedCount: 0
                failures:
                  - index: 0
                    error: BAD_BODY_VALUE
                    retryable: false
        "401":
          description: Missing or invalid bearer credential; no sends.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Insufficient credential capability; no sends.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Whole-body/front-door limit before evaluation (ApiError), or zero
            accepted with only encoded-message-size item failures (batch
            report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
              example:
                submissionId: plis1_example
                acceptedCount: 0
                failures:
                  - index: 0
                    sourceListingId: SKU-001
                    error: PRODUCT_LISTING_INGESTION_PAYLOAD_TOO_LARGE
                    retryable: false
        "500":
          description: Pre-evaluation internal/configuration failure (ApiError), or zero
            accepted with an item internal/configuration failure and no
            retryable send outcome (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
              example:
                submissionId: plis1_example
                acceptedCount: 0
                failures:
                  - index: 0
                    sourceListingId: SKU-001
                    error: PRODUCT_LISTING_INGESTION_INTERNAL_ERROR
                    retryable: false
        "503":
          description: Pre-evaluation transient dependency failure (ApiError), or zero
            accepted with an unconfirmed/retryable send, deadline or blocked
            outcome (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
              example:
                submissionId: plis1_example
                acceptedCount: 0
                failures:
                  - index: 0
                    sourceListingId: SKU-001
                    error: ENQUEUE_UNCONFIRMED
                    retryable: true
                  - index: 1
                    sourceListingId: SKU-001
                    error: ENQUEUE_BLOCKED
                    retryable: true
  /api/v1/oauth/tokens/by-third-party-code/{thirdPartyCode}:
    get:
      summary: Exchange OAuth token by third-party code
      description: >
        Exchanges a one-time `third_party_exchange_code` returned by `POST
        /api/v1/oauth/token`

        for the same Aura Historia access token. No client credentials or bearer
        token are required.


        The exchange code expires after 60 seconds and is deleted whether the
        exchange succeeds or

        fails due to expiry.
      operationId: oauthTokenByThirdPartyCode
      tags:
        - OAuth
      parameters:
        - name: thirdPartyCode
          in: path
          required: true
          description: UUIDv7 one-time exchange code returned by the OAuth token endpoint.
          schema:
            type: string
            format: uuid
          example: 01970f22-2bf0-7000-8000-000000000099
      responses:
        "200":
          description: Access token returned successfully for a valid third-party exchange
            code.
          headers:
            Cache-Control:
              description: Always set to `no-store`.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponseData"
              example:
                access_token: aurahistoria_abcdefghijk_verylongtokenvalue
                token_type: BEARER
                expires_in: null
                scope: product-listings:write
        "400":
          description: >
            Bad request — the path parameter is missing/invalid, or the exchange
            code was not found

            or already expired. The backend currently uses the same

            `OAUTH_THIRD_PARTY_EXCHANGE_CODE_NOT_FOUND` error code for both
            unknown and expired

            exchange codes; the `detail` text distinguishes the two cases.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_third_party_code:
                  summary: Missing third-party exchange code path parameter
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_PATH_PARAMETER_VALUE
                    source:
                      field: thirdPartyCode
                      type: PATH
                    detail: Missing path parameter thirdPartyCode
                invalid_third_party_code:
                  summary: Invalid third-party exchange code
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: thirdPartyCode
                      type: PATH
                    detail: Path parameter 'thirdPartyCode' is invalid.
                exchange_code_not_found:
                  summary: Third-party exchange code not found
                  value:
                    status: 400
                    title: Bad Request
                    error: OAUTH_THIRD_PARTY_EXCHANGE_CODE_NOT_FOUND
                    detail: Third-party exchange code not found.
                exchange_code_expired:
                  summary: Third-party exchange code expired
                  value:
                    status: 400
                    title: Bad Request
                    error: OAUTH_THIRD_PARTY_EXCHANGE_CODE_NOT_FOUND
                    detail: Third-party exchange code expired.
        "500":
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
components:
  schemas:
    PutWoocommerceListingSourceIngestionConfigurationData:
      type: object
      additionalProperties: false
      required:
        - webhookSecret
      properties:
        webhookSecret:
          type: string
          writeOnly: true
          description: Required nonblank provider secret. Preserved exactly for HMAC
            verification and never returned.
        currency:
          allOf:
            - $ref: "#/components/schemas/CurrencyData"
          nullable: true
        language:
          allOf:
            - $ref: "#/components/schemas/LanguageData"
          nullable: true
    ApiError:
      type: object
      description: Standard error response format (RFC 9457)
      required:
        - status
        - title
        - error
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        title:
          type: string
          description: HTTP status code in human-readable form
          example: Bad Request
        error:
          type: string
          description: Error code identifier
          example: BAD_PARAMETER
        source:
          $ref: "#/components/schemas/ApiErrorSource"
        detail:
          type: string
          description: Human-readable error message
          example: "Expected any of: 'true' or 'false'. Got: 'invalid'"
    CreateProductListingData:
      type: object
      additionalProperties: false
      description: >
        Data for creating a single product via the partner batch-create endpoint.
      required:
        - sourceListingId
        - url
        - images
      properties:
        sourceListingId:
          type: string
          description: The listing source's own identifier for the product. Must be unique
            within the listing source.
          example: baroque-violin-001
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized title. Omit or send `null` when no title is
            available.
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized description. Omit or send `null` when no
            description is available.
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
          description: Optional asking-price assertion for the product.
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional lower bound of the estimated price range
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional upper bound of the estimated price range
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
          description: Omit or send `null` when Aura has no reliable current availability
            assertion.
        url:
          type: string
          format: uri
          description: URL to the product on the listing source's website
          example: https://my-listing-source.com/product-listings/baroque-violin
        images:
          type: array
          items:
            type: string
            format: uri
          description: List of image URLs for the product. May be empty.
          example:
            - https://my-listing-source.com/images/violin-1.jpg
            - https://my-listing-source.com/images/violin-2.jpg
        auction:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionData"
          description: Omit for no Auction or lot changes, or send an asserted nested
            Auction/lot-facts patch. `null` is invalid. `auctionId` must
            identify an existing Auction for this ListingSource.
    AsyncProductListingBatchReport:
      type: object
      additionalProperties: false
      description: Admission report, not a listing creation or update result. For
        every evaluated batch, acceptedCount plus the number of failures equals
        the original array length.
      required:
        - submissionId
        - acceptedCount
        - failures
      properties:
        submissionId:
          type: string
          description: Opaque correlation identifier only; not a status resource or batch
            deduplication token.
          example: plis1_example
        acceptedCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of publisher-confirmed admitted entries; never includes
            unconfirmed sends.
        failures:
          type: array
          maxItems: 100
          description: Exactly one per non-confirmed original entry, sorted by original
            zero-based index. Empty for fully admitted or empty batches.
          items:
            $ref: "#/components/schemas/AsyncProductListingBatchFailure"
    OAuthTokenResponseData:
      type: object
      description: >
        Token response returned by `POST /api/v1/oauth/token` and

        `GET /api/v1/oauth/tokens/by-third-party-code/{thirdPartyCode}`.

        The `access_token` is an Aura Historia bearer access token. `expires_in`
        is omitted

        (`null`) for non-expiring tokens. `third_party_exchange_code` is only
        present on the

        direct token exchange response.
      required:
        - access_token
        - token_type
        - scope
      properties:
        access_token:
          type: string
          description: The issued Aura Historia access token (plaintext bearer value).
          example: aurahistoria_abcdefghijk_verylongtokenvalue
        token_type:
          $ref: "#/components/schemas/AccessTokenTypeData"
        expires_in:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Seconds until the access token expires. `null` when the token does
            not expire.
          example: null
        scope:
          type: string
          description: Space-separated list of scopes granted to the access token.
          example: product-listings:write
        third_party_exchange_code:
          type: string
          format: uuid
          description: >
            Optional one-time exchange code returned by `POST
            /api/v1/oauth/token`.

            It can be redeemed once via `GET
            /api/v1/oauth/tokens/by-third-party-code/{thirdPartyCode}`

            within 60 seconds to obtain the same access token.
          example: 01970f22-2bf0-7000-8000-000000000099
    CurrencyData:
      type: string
      enum:
        - EUR
        - GBP
        - USD
        - AUD
        - CAD
        - NZD
        - CNY
        - BRL
        - PLN
        - TRY
        - JPY
        - CZK
        - RUB
        - AED
        - SAR
        - HKD
        - SGD
        - CHF
      description: |
        Supported currencies (ISO 4217 codes):
        - EUR: Euro
        - GBP: British Pound
        - USD: US Dollar
        - AUD: Australian Dollar
        - CAD: Canadian Dollar
        - NZD: New Zealand Dollar
        - CNY: Chinese Yuan
        - BRL: Brazilian Real
        - PLN: Polish Złoty
        - TRY: Turkish Lira
        - JPY: Japanese Yen
        - CZK: Czech Koruna
        - RUB: Russian Ruble
        - AED: UAE Dirham
        - SAR: Saudi Riyal
        - HKD: Hong Kong Dollar
        - SGD: Singapore Dollar
        - CHF: Swiss Franc
      default: EUR
      example: EUR
    LanguageData:
      type: string
      enum:
        - de
        - en
        - fr
        - es
        - it
        - zh
        - pt
        - pl
        - tr
        - nl
        - cs
        - ja
        - ru
        - ar
      description: >
        Supported language codes (ISO 639-1 canonical values):

        - de: German (includes de-DE, de-AT, de-CH, de-LU, de-LI)

        - en: English (includes en-US, en-GB, en-AU, en-CA, en-NZ, and
        backend-specific accepted alias en_IE)

        - fr: French (includes fr-FR, fr-CA, fr-BE, fr-CH, fr-LU)

        - es: Spanish (includes es-ES, es-MX, es-AR, es-CO, es-CL, es-PE, es-VE)

        - it: Italian (includes it-IT, it-CH)

        - zh: Chinese (Simplified) (includes zh-CN, zh-Hans)

        - pt: Portuguese (includes pt-PT, pt-BR)

        - pl: Polish (includes pl-PL)

        - tr: Turkish (includes tr-TR)

        - nl: Dutch (includes nl-NL, nl-BE)

        - cs: Czech (includes cs-CZ)

        - ja: Japanese (includes ja-JP)

        - ru: Russian (includes ru-RU)

        - ar: Arabic (includes ar-SA, ar-EG, ar-AE)


        `de`, `en`, `fr`, `es`, and `it` are fully supported
        localization/translation-target languages.

        `zh`, `pt`, `pl`, `tr`, `nl`, `cs`, `ja`, `ru`, and `ar` are
        ingestion-only languages:

        they can appear in stored/native content and are accepted anywhere
        `LanguageData` is used,

        but backend-generated translations and fallback localized strings are
        not produced in these languages.
      default: en
      example: de
    ApiErrorSource:
      type: object
      description: Information about the source of the error
      required:
        - field
        - type
      properties:
        field:
          type: string
          description: Name of the field that caused the error
          example: listingSourceId
        type:
          type: string
          enum:
            - QUERY
            - PATH
            - HEADER
            - BODY
          description: Type of parameter that caused the error
          example: PATH
    LocalizedTextData:
      type: object
      description: Text content with language information
      required:
        - text
        - language
      properties:
        text:
          type: string
          description: The text content
        language:
          $ref: "#/components/schemas/LanguageData"
    ProductListingPriceData:
      oneOf:
        - type: object
          required:
            - type
            - currency
            - amount
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
                - MONETARY
            currency:
              $ref: "#/components/schemas/CurrencyData"
            amount:
              type: integer
              minimum: 0
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
                - ON_REQUEST
    PriceData:
      type: object
      description: Price information with currency
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyData"
        amount:
          type: integer
          description: Price amount in minor currency units (e.g., cents for most
            supported currencies, whole yen for JPY)
          minimum: 0
          example: 2999
    ListingAvailabilityData:
      type: string
      enum:
        - AVAILABLE
        - IN_STOCK
        - LIMITED_AVAILABILITY
        - BACK_ORDER
        - MADE_TO_ORDER
        - PRE_ORDER
        - PRE_SALE
        - UNAVAILABLE
        - RESERVED
        - OUT_OF_STOCK
        - SOLD_OUT
      description: Current reliable source assertion of listing purchase availability.
        Omitted or `null` means Aura has no reliable current assertion.
      example: IN_STOCK
    ProductListingAuctionData:
      type: object
      additionalProperties: false
      description: Partner ProductListing nested write patch. `auctionId` must
        identify an existing Auction for the same ListingSource. Omit it to
        preserve membership, send null to clear membership, or send a value to
        set it. Omit a lot/timing leaf to preserve it, send null to clear a
        clearable leaf, or send a value to set it.
      properties:
        auctionId:
          type: string
          nullable: true
          description: Existing same-ListingSource Aura Auction TypeID. Omit to preserve
            membership; send null to clear it.
          example: auc_01jgfjjz4ne2g0000000000000
        lotNumber:
          type: string
          maxLength: 128
          nullable: true
          description: Omit to preserve the lot label; send null to clear it; send a value
            to set it.
          example: 42A
        cataloguePosition:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: Omit to preserve the catalogue position; send null to clear it;
            send a value to set it.
          example: 7
        timing:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionTimesData"
          nullable: true
    AsyncProductListingBatchFailure:
      type: object
      additionalProperties: false
      required:
        - index
        - error
        - retryable
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99
          description: Original zero-based batch position, authoritative even when
            sourceListingId cannot be echoed.
        sourceListingId:
          type: string
          description: Included only if present, valid, and safe to echo; omitted otherwise.
        error:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Bounded safe code, never raw exception or payload text. Includes
            BAD_BODY_VALUE, PRODUCT_LISTING_INGESTION_PAYLOAD_TOO_LARGE,
            ENQUEUE_FAILED (definitely unsuccessful send), ENQUEUE_UNCONFIRMED
            (possibly queued), ENQUEUE_NOT_ATTEMPTED (budget before send),
            ENQUEUE_BLOCKED (eligible FIFO successor held),
            PRODUCT_LISTING_INGESTION_INTERNAL_ERROR, and applicable narrower
            item-validation codes.
          example: ENQUEUE_UNCONFIRMED
        retryable:
          type: boolean
          description: Whether unchanged-whole-batch retry is appropriate; never
            permission to resubmit a compacted subset with the same key.
            Unconfirmed is retryable; validation and size errors are not.
            Blocked inherits its predecessor's retryability; deterministic
            configuration errors need repair.
    AccessTokenTypeData:
      type: string
      enum:
        - BEARER
      description: Token type returned for Aura Historia access tokens.
      example: BEARER
    ProductListingAuctionTimesData:
      type: object
      additionalProperties: false
      description: Omit each leaf to preserve it; send null to clear it; values are
        RFC3339 instants.
      properties:
        biddingOpens:
          type: string
          format: date-time
          nullable: true
        scheduledCloses:
          type: string
          format: date-time
          nullable: true
        reportedClosedAt:
          type: string
          format: date-time
          nullable: true
  parameters:
    AsyncProductListingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: One value only; native duplicates and comma-joined values are
        invalid (`400 BAD_HEADER_VALUE`) before publication. Use 1–128 visible
        ASCII bytes excluding comma. Supply the same key with the unchanged
        ordered batch for transport retries. If absent, a key is generated and
        returned on evaluated reports; it cannot be recovered if that response
        is lost.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x2B\x2D-\x7E]{1,128}$
      example: catalog-sync-2026-09-29
  headers:
    AsyncProductListingIdempotencyKey:
      description: Effective key, echoed on every evaluated report (including
        non-2xx); not guaranteed on pre-evaluation ApiError responses.
        CORS-exposed for browser clients.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x2B\x2D-\x7E]{1,128}$
      example: catalog-sync-2026-09-29
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Cognito JWT bearer token.

        This scheme is used for authenticated user routes and for partner routes
        that accept Cognito user tokens.
    AccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Aura Historia bearer access token created through
        `/api/v1/me/access-tokens`.

        Tokens are sent as standard bearer authorization headers.

        Selected partner routes accept this scheme instead of the removed
        partner API-key flow.
tags:
  - name: ProductListings
    description: Product retrieval, product history, similar-product discovery,
      product search, and partner catalog ingestion workflows.
  - name: ListingSources
    description: ListingSource retrieval, authenticated creation and update, and
      caller-administered listing sources.
  - name: OAuth
    description: OAuth 2.0 authorization, token, revocation, introspection, and
      OAuth client metadata management.
